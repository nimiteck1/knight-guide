<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Tester</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #9333ea, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        h2 { margin-bottom: 1rem; font-size: 1.25rem; color: #9333ea; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #e0e0e0;
            margin-bottom: 1rem;
            font-family: inherit;
        }
        textarea { min-height: 100px; resize: vertical; }
        button {
            background: linear-gradient(90deg, #9333ea, #7c3aed);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 0.5rem;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .response-box {
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { border-left: 4px solid #22c55e; }
        .error { border-left: 4px solid #ef4444; }
        .loading { opacity: 0.7; }
        .status { padding: 0.5rem; border-radius: 4px; display: inline-block; margin-bottom: 0.5rem; }
        .status.ok { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status.fail { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px 8px 0 0;
            color: #e0e0e0;
            cursor: pointer;
        }
        .tab.active { background: rgba(147, 51, 234, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 API Key Tester</h1>

        <!-- API Key Input -->
        <div class="card">
            <h2>API Configuration</h2>
            <label>OpenAI API Key:</label>
            <input type="password" id="apiKey" placeholder="sk-..." />
            <label>Supabase Edge Function URL (optional):</label>
            <input type="text" id="edgeFunctionUrl" placeholder="https://your-project.supabase.co/functions/v1/generate-itinerary" />
        </div>

        <!-- Test OpenAI Directly -->
        <div class="card">
            <h2>1. Test OpenAI API Directly</h2>
            <p style="margin-bottom:1rem;color:#888;">This tests your API key directly with OpenAI.</p>
            <label>Prompt:</label>
            <textarea id="openaiPrompt">Say "Hello, the API is working!" in one sentence.</textarea>
            <button onclick="testOpenAI()">🚀 Test OpenAI</button>
            <div id="openaiResult" class="response-box" style="display:none;"></div>
        </div>

        <!-- Test Supabase Edge Function -->
        <div class="card">
            <h2>2. Test Supabase Edge Function</h2>
            <p style="margin-bottom:1rem;color:#888;">This tests your deployed Edge Function.</p>
            <div class="tabs">
                <button class="tab active" onclick="setMethod('POST')">POST</button>
                <button class="tab" onclick="setMethod('GET')">GET</button>
            </div>
            <label>Request Body (JSON for POST):</label>
            <textarea id="edgeBody">{
  "location": "Paris",
  "startDate": "2026-01-20",
  "endDate": "2026-01-22",
  "mood": "relaxed"
}</textarea>
            <button onclick="testEdgeFunction()">🌐 Test Edge Function</button>
            <div id="edgeResult" class="response-box" style="display:none;"></div>
        </div>

        <!-- Quick Itinerary Test -->
        <div class="card">
            <h2>3. Quick Itinerary Generation Test</h2>
            <p style="margin-bottom:1rem;color:#888;">Generate a travel itinerary directly using your OpenAI key.</p>
            <label>Location:</label>
            <input type="text" id="testLocation" value="Tokyo" />
            <label>Days:</label>
            <input type="number" id="testDays" value="2" min="1" max="5" />
            <button onclick="testItineraryDirect()">✨ Generate Itinerary</button>
            <div id="itineraryResult" class="response-box" style="display:none;"></div>
        </div>
    </div>

    <script>
        let currentMethod = 'POST';

        function setMethod(method) {
            currentMethod = method;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showResult(elementId, content, isError = false) {
            const el = document.getElementById(elementId);
            el.style.display = 'block';
            el.className = 'response-box ' + (isError ? 'error' : 'success');
            el.textContent = typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
        }

        async function testOpenAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('openaiPrompt').value.trim();
            
            if (!apiKey) {
                showResult('openaiResult', 'Please enter your OpenAI API key.', true);
                return;
            }

            showResult('openaiResult', 'Testing OpenAI API...');
            
            try {
                const startTime = Date.now();
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{ role: 'user', content: prompt }],
                        max_tokens: 100
                    })
                });

                const elapsed = Date.now() - startTime;
                const data = await response.json();
                
                if (response.ok) {
                    showResult('openaiResult', `✅ SUCCESS (${elapsed}ms)\n\nResponse:\n${data.choices[0]?.message?.content || 'No content'}\n\nFull Response:\n${JSON.stringify(data, null, 2)}`);
                } else {
                    showResult('openaiResult', `❌ ERROR (${response.status})\n\n${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                showResult('openaiResult', `❌ NETWORK ERROR\n\n${error.message}`, true);
            }
        }

        async function testEdgeFunction() {
            const url = document.getElementById('edgeFunctionUrl').value.trim();
            const body = document.getElementById('edgeBody').value.trim();

            if (!url) {
                showResult('edgeResult', 'Please enter your Supabase Edge Function URL.', true);
                return;
            }

            showResult('edgeResult', `Testing Edge Function (${currentMethod})...`);

            try {
                const startTime = Date.now();
                const options = {
                    method: currentMethod,
                    headers: { 'Content-Type': 'application/json' }
                };
                
                if (currentMethod === 'POST' && body) {
                    options.body = body;
                }

                const response = await fetch(url, options);
                const elapsed = Date.now() - startTime;
                
                let data;
                try {
                    data = await response.json();
                } catch {
                    data = await response.text();
                }

                const status = response.ok ? '✅ SUCCESS' : '❌ ERROR';
                showResult('edgeResult', `${status} (${response.status}) - ${elapsed}ms\n\n${JSON.stringify(data, null, 2)}`, !response.ok);
            } catch (error) {
                showResult('edgeResult', `❌ NETWORK ERROR\n\n${error.message}`, true);
            }
        }

        async function testItineraryDirect() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const location = document.getElementById('testLocation').value.trim();
            const days = parseInt(document.getElementById('testDays').value) || 2;
            
            if (!apiKey) {
                showResult('itineraryResult', 'Please enter your OpenAI API key.', true);
                return;
            }

            showResult('itineraryResult', 'Generating itinerary...');
            
            const prompt = `Create a ${days}-day travel itinerary for ${location}.
Return ONLY valid JSON in this format:
{"tripSummary":"..","accessibilityNotes":"..","days":[{"day":1,"title":"..","activities":[{"time":"9AM","activity":"..","accessibility":".."}]}]}
Include 3 activities per day. JSON only, no markdown.`;

            try {
                const startTime = Date.now();
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [
                            { role: 'system', content: 'Travel planner. JSON only.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                const elapsed = Date.now() - startTime;
                const data = await response.json();
                
                if (response.ok) {
                    const content = data.choices[0]?.message?.content || '';
                    let itinerary;
                    try {
                        itinerary = JSON.parse(content.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim());
                        showResult('itineraryResult', `✅ SUCCESS (${elapsed}ms)\n\n${JSON.stringify(itinerary, null, 2)}`);
                    } catch {
                        showResult('itineraryResult', `⚠️ PARSE ERROR (${elapsed}ms)\n\nRaw response:\n${content}`, true);
                    }
                } else {
                    showResult('itineraryResult', `❌ ERROR (${response.status})\n\n${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                showResult('itineraryResult', `❌ NETWORK ERROR\n\n${error.message}`, true);
            }
        }
    </script>
</body>
</html>
